<?xml version="1.0" encoding="UTF-8"?>
<!--
  saltypoolwater logo icon
  A shark fin rising through a pool inner tube. Wrong pool. Stay salty.

  Editable in Inkscape: each part is a named group (Layer menu > Objects panel).
  Palette matches the site: water #DFF3F7, navy #0E3A5C, coral #FF5C4D, tile #8FD0DE.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- The inner-tube ring (outer ellipse minus hole) used as a clip -->
    <clipPath id="ringClip" clip-rule="evenodd">
      <path clip-rule="evenodd" fill-rule="evenodd" d="
        M 256 266
        a 170 64 0 1 0 0.001 0 Z
        M 256 300
        a 88 30 0 1 0 0.001 0 Z" />
    </clipPath>
    <!-- Split the tube into a back half (behind the fin) and front half (in front) -->
    <clipPath id="backHalf"><rect x="0" y="0" width="512" height="330"/></clipPath>
    <clipPath id="frontHalf"><rect x="0" y="330" width="512" height="182"/></clipPath>
  </defs>

  <!-- Background: pool water -->
  <g id="background">
    <circle cx="256" cy="256" r="248" fill="#DFF3F7"/>
  </g>

  <!-- Water visible inside the tube's hole -->
  <g id="hole-water">
    <ellipse cx="256" cy="330" rx="88" ry="30" fill="#A9DEEA"/>
  </g>

  <!-- Back half of the inner tube (fin passes in front of this) -->
  <g id="tube-back" clip-path="url(#backHalf)">
    <g clip-path="url(#ringClip)">
      <rect x="0" y="0" width="512" height="512" fill="#FF5C4D"/>
      <!-- lifebuoy stripes -->
      <rect id="stripe-top" x="232" y="250" width="48" height="60" fill="#FFFFFF"/>
      <rect id="stripe-left" x="62" y="306" width="66" height="48" fill="#FFFFFF"/>
      <rect id="stripe-right" x="384" y="306" width="66" height="48" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- The shark fin -->
  <g id="fin">
    <path fill="#0E3A5C" d="
      M 230 338
      C 226 262 244 182 306 118
      C 300 196 306 262 326 334
      C 296 326 258 328 230 338 Z"/>
    <!-- trailing-edge sheen -->
    <path fill="#1D527A" d="
      M 306 118
      C 302 196 308 262 326 334
      C 316 330 306 328 296 327
      C 286 258 286 192 306 118 Z"/>
  </g>

  <!-- Front half of the inner tube (covers the fin's base) -->
  <g id="tube-front" clip-path="url(#frontHalf)">
    <g clip-path="url(#ringClip)">
      <rect x="0" y="0" width="512" height="512" fill="#FF5C4D"/>
      <rect id="stripe-bottom" x="232" y="352" width="48" height="60" fill="#FFFFFF"/>
      <rect id="stripe-left-f" x="62" y="306" width="66" height="48" fill="#FFFFFF"/>
      <rect id="stripe-right-f" x="384" y="306" width="66" height="48" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Specular highlight on the tube's upper-left -->
  <g id="highlight">
    <path fill="none" stroke="#FFD9D4" stroke-width="10" stroke-linecap="round"
      d="M 128 296 a 150 54 0 0 1 60 -24"/>
  </g>

  <!-- Ripples where the fin cuts the water -->
  <g id="ripples" fill="none" stroke="#8FD0DE" stroke-width="8" stroke-linecap="round">
    <path d="M 70 416 q 26 -12 52 0"/>
    <path d="M 390 420 q 26 -12 52 0"/>
    <path d="M 176 448 q 26 -12 52 0"/>
    <path d="M 300 452 q 26 -12 52 0"/>
  </g>
</svg>
