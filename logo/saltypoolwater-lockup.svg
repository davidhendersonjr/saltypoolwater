<?xml version="1.0" encoding="UTF-8"?>
<!--
  saltypoolwater horizontal lockup (icon + wordmark).
  The wordmark uses live <text>. Before exporting for the web, open in
  Inkscape, select the text, and use Path > Object to Path so it renders
  identically everywhere regardless of installed fonts.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <g id="icon" transform="translate(20,20) scale(0.39)">
    <circle cx="256" cy="256" r="248" fill="#DFF3F7"/>
    <ellipse cx="256" cy="330" rx="88" ry="30" fill="#A9DEEA"/>
    <defs>
      <clipPath id="ringClipL" clip-rule="evenodd">
        <path clip-rule="evenodd" fill-rule="evenodd" d="M 256 266 a 170 64 0 1 0 0.001 0 Z M 256 300 a 88 30 0 1 0 0.001 0 Z"/>
      </clipPath>
      <clipPath id="backHalfL"><rect x="0" y="0" width="512" height="330"/></clipPath>
      <clipPath id="frontHalfL"><rect x="0" y="330" width="512" height="182"/></clipPath>
    </defs>
    <g clip-path="url(#backHalfL)">
      <g clip-path="url(#ringClipL)">
        <rect x="0" y="0" width="512" height="512" fill="#FF5C4D"/>
        <rect x="232" y="250" width="48" height="60" fill="#FFFFFF"/>
        <rect x="62" y="306" width="66" height="48" fill="#FFFFFF"/>
        <rect x="384" y="306" width="66" height="48" fill="#FFFFFF"/>
      </g>
    </g>
    <path fill="#0E3A5C" d="M 230 338 C 226 262 244 182 306 118 C 300 196 306 262 326 334 C 296 326 258 328 230 338 Z"/>
    <path fill="#1D527A" d="M 306 118 C 302 196 308 262 326 334 C 316 330 306 328 296 327 C 286 258 286 192 306 118 Z"/>
    <g clip-path="url(#frontHalfL)">
      <g clip-path="url(#ringClipL)">
        <rect x="0" y="0" width="512" height="512" fill="#FF5C4D"/>
        <rect x="232" y="352" width="48" height="60" fill="#FFFFFF"/>
        <rect x="62" y="306" width="66" height="48" fill="#FFFFFF"/>
        <rect x="384" y="306" width="66" height="48" fill="#FFFFFF"/>
      </g>
    </g>
    <path fill="none" stroke="#FFD9D4" stroke-width="10" stroke-linecap="round" d="M 128 296 a 150 54 0 0 1 60 -24"/>
    <g fill="none" stroke="#8FD0DE" stroke-width="8" stroke-linecap="round">
      <path d="M 70 416 q 26 -12 52 0"/>
      <path d="M 390 420 q 26 -12 52 0"/>
      <path d="M 176 448 q 26 -12 52 0"/>
      <path d="M 300 452 q 26 -12 52 0"/>
    </g>
  </g>
  <g id="wordmark" font-family="Avenir Next, Trebuchet MS, Verdana, sans-serif" font-weight="800" font-size="72" letter-spacing="-2">
    <text x="250" y="145"><tspan fill="#FF5C4D">salty</tspan><tspan fill="#0E3A5C">poolwater</tspan></text>
    <text x="253" y="185" font-size="22" font-weight="400" letter-spacing="0" fill="#4A7186">one complaint a day. make it funny.</text>
  </g>
</svg>
